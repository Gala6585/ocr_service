name: ocr-service

x-db: &database
  PGHOST: postgres
  PGDATABASE: ocr
  PGUSER: ocr_app
  PGPASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
  REDIS_URL: redis://redis:6379/0
  RESULT_TTL_SECONDS: ${RESULT_TTL_SECONDS:-604800}
  DOWNLOAD_TTL_SECONDS: ${DOWNLOAD_TTL_SECONDS:-86400}
  FAILED_TTL_SECONDS: ${FAILED_TTL_SECONDS:-86400}
  CLEANUP_INTERVAL_SECONDS: ${CLEANUP_INTERVAL_SECONDS:-30}

x-api: &api-image
  image: ocr-service-api:local
  pull_policy: never

x-ready: &ready
  migrate: {condition: service_completed_successfully}
  redis: {condition: service_healthy}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ocr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "ocr"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *api-image
    command: ["python", "-m", "service.migrate"]
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      PGHOST: postgres
      PGDATABASE: ocr
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      READONLY_DB_PASSWORD: ${READONLY_DB_PASSWORD:?Set READONLY_DB_PASSWORD in .env}
      OCR_USERNAME: ${OCR_USERNAME:-operator}
      OCR_PASSWORD: ${OCR_PASSWORD:?Set OCR_PASSWORD in .env}

  flask:
    <<: *api-image
    build: {context: ., target: api}
    restart: unless-stopped
    depends_on: *ready
    environment: *database
    ports: ["127.0.0.1:${API_PORT:-5000}:5000"]
    volumes:
      - ./data/temporary:/data/temporary
      - ./data/datasets:/data/datasets
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 15

  rq-worker:
    image: ocr-service-worker:local
    build: {context: ., target: worker}
    restart: unless-stopped
    depends_on: *ready
    environment: *database
    volumes:
      - ./data/temporary:/data/temporary
      - ocr-models:/models

  cleanup-worker:
    <<: *api-image
    restart: unless-stopped
    command: ["python", "-m", "service.maintenance"]
    depends_on: *ready
    environment: *database
    volumes: [./data/temporary:/data/temporary]

  streamlit:
    image: ocr-service-ui:local
    build: {context: ., target: ui}
    restart: unless-stopped
    depends_on:
      flask: {condition: service_healthy}
    environment:
      API_URL: http://flask:5000
      DISPLAY_TIMEZONE: ${DISPLAY_TIMEZONE:-Europe/Moscow}
    ports: ["127.0.0.1:${UI_PORT:-8501}:8501"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:9.10
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
    ports: ["127.0.0.1:${PGADMIN_PORT:-5050}:80"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env}
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./deploy/servers.json:/pgadmin4/servers.json:ro

volumes:
  postgres-data:
  redis-data:
  pgadmin-data:
  ocr-models:
